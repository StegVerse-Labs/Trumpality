# .github/workflows/weekly-ingest.yml
name: weekly-ingest
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-ingest-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned ingest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt

      # Native ingest pipeline; no external reusable workflow or remote runtime.
      - name: Ingest seed sources
        run: python -m core.ingest_pipeline.url_list_ingest --subject "Donald J. Trump" --topic_cluster general --urls seeds/sources.urls.txt

      - name: Persist records and ingest receipts
        run: |
          git config user.name 'stegverse-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/processed/records.sqlite data/receipts/ingest_receipts.jsonl
          if git diff --cached --quiet; then
            echo 'No ingest change to persist.'
          else
            git commit -m 'ingest: persist weekly native source ingest'
            # Other workflows also persist to this branch; integrate them before pushing.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
