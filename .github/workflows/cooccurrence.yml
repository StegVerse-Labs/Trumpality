name: cooccurrence-scan
on:
  schedule:
    - cron: "15 8 * * 2,5"   # Tue/Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cooccur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt
      - name: Run co-occurrence scan
        run: |
          python core/coocur/scan.py
      - name: Commit co-occurrence graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "cooccurrence: updated graph"
            # Other workflows also persist to this branch; integrate them before pushing.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
