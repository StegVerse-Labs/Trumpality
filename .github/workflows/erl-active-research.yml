name: ERL Active Research Acquisition

on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erl-active-research
  cancel-in-progress: false

jobs:
  acquire-sort-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate research adapter
        run: python tests/test_erl_research_adapter_deterministic.py

      - name: Record pre-cycle receipt count
        run: echo "PRE_CYCLE_RECEIPTS=$(grep -c . research/research_receipts.jsonl || true)" >> "$GITHUB_ENV"

      - name: Acquire new trajectory-scoped source candidates
        run: python scripts/erl_research_agent.py

      - name: Verify source scan evidence exists for active research
        run: |
          python - <<'PY'
          import json,pathlib
          from scripts.erl_research_agent import active
          base=pathlib.Path('.')
          requests=active(base)
          path=base/'research/research_receipts.jsonl'
          receipts=[json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()] if path.exists() else []
          import os
          before=int(os.environ.get('PRE_CYCLE_RECEIPTS') or 0)
          # Pre-existing receipts must not satisfy this cycle; require fresh appended receipts.
          if requests and len(receipts)<=before:
              raise SystemExit('FAIL_CLOSED: this cycle appended no source-scan receipts')
          print(json.dumps({'active_requests':len(requests),'pre_cycle_receipts':before,'persisted_scan_receipts':len(receipts),'cycle_receipts':len(receipts)-before}))
          PY

      - name: Summarize append-only research data without rewriting history
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('research')
          def load_jsonl(p):
              if not p.exists(): return []
              out=[]
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip(): out.append(json.loads(line))
              return out
          # Acquisition JSONL is append-only; never rewrite or deduplicate history.
          candidates=load_jsonl(root/'source_candidates.jsonl')
          receipts=load_jsonl(root/'research_receipts.jsonl')
          status_counts={}
          for r in receipts:
              status_counts[r.get('result','UNKNOWN')]=status_counts.get(r.get('result','UNKNOWN'),0)+1
          trajectory_counts={}
          for c in candidates:
              for t in c.get('trajectory_ids',[]): trajectory_counts[t]=trajectory_counts.get(t,0)+1
          state={
            'schema':'stegverse.erl.active_research_state.v1',
            'repository':'StegVerse-Labs/Trumpality',
            'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'state':'ACQUISITION_OBSERVED' if any(r.get('result')=='CANDIDATES_IDENTIFIED' for r in receipts) else 'NO_CANDIDATE_EVIDENCE',
            'candidate_count':len(candidates),
            'receipt_count':len(receipts),
            'receipt_results':status_counts,
            'trajectory_candidate_counts':trajectory_counts,
            'sorting_actions':['read_only_summarize_result_states'],
            'evaluation_authority_effect':'NONE'
          }
          (root/'active-research-state.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(state,sort_keys=True))
          PY

      - name: Persist acquisition and sorting receipts
        run: |
          git config user.name 'stegverse-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/source_candidates.jsonl research/research_receipts.jsonl research/active-research-state.json
          if git diff --cached --quiet; then
            echo 'No semantic research-data change to persist.'
          else
            git commit -m 'research: persist active ERL acquisition cycle'
            # Prevent silent races and preserve the checked-out expected head.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload cycle artifact
        uses: actions/upload-artifact@v4
        with:
          name: erl-active-research-${{ github.run_id }}
          path: |
            research/source_candidates.jsonl
            research/research_receipts.jsonl
            research/active-research-state.json
          retention-days: 90
